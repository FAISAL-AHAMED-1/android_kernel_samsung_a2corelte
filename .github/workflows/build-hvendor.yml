name: Build A260G H-VENDOR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio zstd xz-utils python3 unzip curl

      - name: Download successful kernel artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p kernel-artifact

          curl -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o kernel-artifact/kernel.zip \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/12195934287/zip"

          unzip -l kernel-artifact/kernel.zip

          unzip -q kernel-artifact/kernel.zip -d kernel-artifact

          find kernel-artifact -type f -print

          test -s kernel-artifact/Image

          mkdir -p out/arch/arm64/boot
          cp kernel-artifact/Image out/arch/arm64/boot/Image

      - name: Verify existing kernel
        run: |
          test -s out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image
          sha256sum out/arch/arm64/boot/Image

      - name: Build final H-VENDOR
        run: |
          ./tools/package_hvendor.sh \
            out/arch/arm64/boot/Image \
            H-VENDOR-A2CORELTE-v1.0.zip

          unzip -t H-VENDOR-A2CORELTE-v1.0.zip

          unzip -p H-VENDOR-A2CORELTE-v1.0.zip \
            device/a2corelte/boot.img > /tmp/boot.img

          python3 - <<'PY'
          import struct

          p = '/tmp/boot.img'
          b = open(p, 'rb').read(4096)

          assert b[:8] == b'ANDROID!'

          print('boot page:', struct.unpack_from('<I', b, 36)[0])
          print('kernel size:', struct.unpack_from('<I', b, 8)[0])
          print('ramdisk size:', struct.unpack_from('<I', b, 16)[0])
          print('dt size:', struct.unpack_from('<I', b, 40)[0])
          PY

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A260G-HVENDOR-v1.0
          path: |
            H-VENDOR-A2CORELTE-v1.0.zip
            H-VENDOR-A2CORELTE-v1.0.zip.sha256
            out/arch/arm64/boot/Image
