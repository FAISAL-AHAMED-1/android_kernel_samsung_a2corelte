name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          path: kernel

      - name: Checkout cross-compiler toolchain
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9
          path: toolchain
          fetch-depth: 1

      - name: Write build script
        run: |
          cat > build.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential bc bison flex libssl-dev libncurses-dev python-is-python3 ca-certificates
          cd kernel
          export ARCH=arm64
          export ANDROID_MAJOR_VERSION=o
          export CROSS_COMPILE=/workspace/toolchain/bin/aarch64-linux-android-
          export KCFLAGS="-fcommon"
          export HOSTCFLAGS="-fcommon"
          make exynos7870-a2corelte_defconfig
          make -j$(nproc)
          SCRIPT
          chmod +x build.sh

      - name: Build kernel (Ubuntu 22.04 container + old-kernel-on-modern-gcc patches)
        run: docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace ubuntu:22.04 ./build.sh

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: a2corelte-kernel-Image
          path: kernel/arch/arm64/boot/Image
          if-no-files-found: error
