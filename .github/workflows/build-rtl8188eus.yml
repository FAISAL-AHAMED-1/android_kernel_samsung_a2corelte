name: Build rtl8188eus module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          path: kernel

      - name: Checkout cross-compiler toolchain
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9
          path: toolchain
          fetch-depth: 1

      - name: Checkout rtl8188eus driver
        uses: actions/checkout@v4
        with:
          repository: aircrack-ng/rtl8188eus
          path: rtl8188eus

      - name: Write build script
        run: |
          cat > build.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential bc bison flex libssl-dev libncurses-dev python-is-python3 ca-certificates

          export ARCH=arm64
          export ANDROID_MAJOR_VERSION=o
          export CROSS_COMPILE=/workspace/toolchain/bin/aarch64-linux-android-
          MAKEFLAGS="HOSTCFLAGS=-fcommon KCFLAGS=-fcommon"

          cd /workspace/kernel
          make $MAKEFLAGS exynos7870-a2corelte_defconfig
          make $MAKEFLAGS -j$(nproc)
          make $MAKEFLAGS modules_prepare

          cd /workspace/rtl8188eus
          sed -i \
            -e '/-Wno-cast-function-type/d' \
            -e '/-Wno-sometimes-uninitialized/d' \
            -e '/-Wno-enum-conversion/d' \
            Makefile

          # GCC 4.9 doesn't know __attribute__((fallthrough)) - turn it into a comment
          grep -rlE '__fallthrough__' --include='*.c' --include='*.h' . | xargs -r sed -i -E 's|__attribute__ *\(\( *__fallthrough__ *\)\)|/* fallthrough */|g'

          # 3.18 module loader rejects COMMON symbols
          echo 'ccflags-y += -fno-common' >> Makefile

          # driver adds -fcommon after ccflags-y, overriding our flag; 3.18 loader rejects COMMON symbols
          grep -rlE -- '-fcommon' . --include=Makefile --include='*.mk' --include=Kbuild | xargs -r sed -i 's/-fcommon/-fno-common/g'
          echo 'EXTRA_CFLAGS += -fno-common' >> Makefile

          # kernel 3.18's cfg80211 predates several API pieces this driver
          # assumes - shim them instead of patching the driver source directly
          cat > compat-oldkernel.h << 'COMPAT'
          #ifndef __RTL8188EUS_OLDKERNEL_COMPAT_H
          #define __RTL8188EUS_OLDKERNEL_COMPAT_H
          #include <net/cfg80211.h>

          #ifndef IEEE80211_BSS_TYPE_ANY
          #define IEEE80211_BSS_TYPE_ANY 0
          #endif
          #ifndef IEEE80211_PRIVACY_ANY
          #define IEEE80211_PRIVACY_ANY 0
          #endif
          #ifndef NL80211_TIMEOUT_UNSPECIFIED
          #define NL80211_TIMEOUT_UNSPECIFIED 0
          #endif

          /* cfg80211_connect_bss() doesn't exist in 3.18 - map onto the
           * older cfg80211_connect_result(), dropping bss/timeout_reason */
          #define cfg80211_connect_bss(dev, bssid, bss, req_ie, req_ie_len, resp_ie, resp_ie_len, status, gfp, timeout_reason) \
          	cfg80211_connect_result(dev, bssid, req_ie, req_ie_len, resp_ie, resp_ie_len, status, gfp)

          /* 3.18's cfg80211_disconnected() predates the locally_generated arg */
          #define cfg80211_disconnected(dev, reason, ie, ie_len, locally_generated, gfp) \
          	cfg80211_disconnected(dev, reason, ie, ie_len, gfp)

          /* 3.18 cfg80211_vendor_event_alloc() has no wdev argument */
          #define cfg80211_vendor_event_alloc(wiphy, wdev, len, event_id, gfp) \
            cfg80211_vendor_event_alloc(wiphy, len, event_id, gfp)

          #endif
          COMPAT

          make ARCH=arm64 \
            CROSS_COMPILE=/workspace/toolchain/bin/aarch64-linux-android- \
            KSRC=/workspace/kernel \
            USER_EXTRA_CFLAGS="-fcommon -Wno-error=implicit-function-declaration -include $(pwd)/compat-oldkernel.h" \
            modules
          SCRIPT
          chmod +x build.sh

      - name: Build kernel + rtl8188eus module
        run: docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace ubuntu:22.04 ./build.sh

      - name: Upload rtl8188eus module
        uses: actions/upload-artifact@v4
        with:
          name: rtl8188eus-ko
          path: rtl8188eus/8188eu.ko
          if-no-files-found: error
